---

- name: update tine
  ansible.builtin.shell: docker compose exec --user tine20 web sh -c "php /usr/share/tine20/setup.php --config=/etc/tine20 --update"
  args:
    chdir: "{{ tinedockercompose_path }}"
  run_once: true

- name: clear tine caches on all hosts (acpu)
  ansible.builtin.shell: docker compose exec --user tine20 web sh -c "php /usr/share/tine20/setup.php --config=/etc/tine20 --clear_cache"
  args:
    chdir: "{{ tinedockercompose_path }}"

- name: restart tine php worker after update
  ansible.builtin.shell: docker compose exec web sh -c "supervisorctl restart worker"
  args:
    chdir: "{{ tinedockercompose_path }}"
